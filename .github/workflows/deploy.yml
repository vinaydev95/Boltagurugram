name: Deploy Bolta Gurugram to AWS EC2

on:
  push:
    branches:
      - main

concurrency:
  group: bolta-gurugram-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -eu
            umask 077
            deploy_sha='${{ github.sha }}'
            releases_root="$HOME/bolta-gurugram-releases"
            mkdir -p "$releases_root"
            release_dir=$(mktemp -d "$releases_root/$deploy_sha-$(date -u +%Y%m%dT%H%M%SZ)-XXXXXX")
            git -C "$release_dir" init --quiet
            git -C "$release_dir" remote add origin https://github.com/vinaydev95/Boltagurugram.git
            git -C "$release_dir" fetch --depth=1 origin "$deploy_sha"
            git -C "$release_dir" checkout --quiet --detach FETCH_HEAD
            bash "$release_dir/scripts/deploy.sh" "$deploy_sha"
