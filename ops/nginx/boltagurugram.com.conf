# Installed in /etc/nginx/sites-available/boltagurugram.com (http context).
# Preserve the existing certificate paths and upstream port.
log_format boltagurugram_json escape=json
    '{"time":"$time_iso8601","host":"$host","ip":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_status":"$upstream_status",'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"upstream_header_time":"$upstream_header_time",'
    '"upstream_response_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"}';

server {
    server_name boltagurugram.com;
    access_log /var/log/nginx/boltagurugram-access.log boltagurugram_json;
    error_log /var/log/nginx/boltagurugram-error.log warn;

    location /_next/static/ {
        alias /home/ubuntu/bolta-gurugram/.next/static/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /public/ {
        alias /home/ubuntu/bolta-gurugram/public/;
        expires 30d;
    }

    location = /app-ads.txt {
        alias /home/ubuntu/bolta-gurugram/public/app-ads.txt;
        default_type text/plain;
    }

    location = /ads.txt {
        alias /home/ubuntu/bolta-gurugram/public/ads.txt;
        default_type text/plain;
    }

    location = /robots.txt {
        alias /home/ubuntu/bolta-gurugram/public/robots.txt;
        default_type text/plain;
    }

    location ~ ^/(google[a-z0-9]+\.html)$ {
        default_type text/html;
        return 200 "google-site-verification: $1\n";
    }

    location / {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/boltagurugram.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boltagurugram.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 443 ssl http2;
    server_name www.boltagurugram.com;
    access_log /var/log/nginx/boltagurugram-access.log boltagurugram_json;
    error_log /var/log/nginx/boltagurugram-error.log warn;

    ssl_certificate /etc/letsencrypt/live/boltagurugram.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boltagurugram.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://boltagurugram.com$request_uri;
}

server {
    listen 80;
    server_name boltagurugram.com www.boltagurugram.com;
    access_log /var/log/nginx/boltagurugram-access.log boltagurugram_json;
    error_log /var/log/nginx/boltagurugram-error.log warn;
    return 301 https://boltagurugram.com$request_uri;
}
